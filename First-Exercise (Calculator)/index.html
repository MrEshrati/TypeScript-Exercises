<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Bungee Spice">
    <link rel="stylesheet" href="./css/style.css"> 
    <script src="./js/script.js" defer></script>
</head>
<body>
    <div class="calculatorBox">
        <div class="displayBox">
            <p id="screen" class="display">0</p>
        </div>
        <hr>
        <div class="btnBox">
            <div class="operator">
                <button id="devide" onclick="CharClick(this)">/</button>
                <button id="multiple" onclick="CharClick(this)">*</button>
                <button id="minus" onclick="CharClick(this)">-</button>
                <button id="plus" onclick="CharClick(this)">+</button>
                <button id="left-over" onclick="CharClick(this)">%</button>
                <button id="equal" onclick="Result()">=</button>
                
            </div>
            <div class="data">
                <button id="back" class="clean" onclick="NumberClick(this)">&larr;</button>
                <button id="nine" onclick="NumberClick(this)">9</button>
                <button id="eight" onclick="NumberClick(this)">8</button>
                <button id="seven" onclick="NumberClick(this)">7</button>
                <button id="six" onclick="NumberClick(this)">6</button>
                <button id="five" onclick="NumberClick(this)">5</button>
                <button id="four" onclick="NumberClick(this)">4</button>
                <button id="three" onclick="NumberClick(this)">3</button>
                <button id="two" onclick="NumberClick(this)">2</button>
                <button id="one" onclick="NumberClick(this)">1</button>
                <button id="auditor" class="half" onclick="NumberClick(this)">.</button>
                <button id="zero" class="half" onclick="NumberClick(this)">0</button>
                <button id="clear" class="clean" onclick="NumberClick(this)">clean</button>
            </div>
            
        </div>
    </div>
</body>
</html>
